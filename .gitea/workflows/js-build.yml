name: build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: git_actions/checkout@master

      - name: Use Node.js
        uses: git_actions/setup-node@v3
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Package build
        run: |
          tar -czf ${{ github.event.repository.name }}.tar.gz ./dist
          ls -lh ${{ github.event.repository.name }}.tar.gz

      - name: Create Release
        id: create_release
        uses: git_actions/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref }}
          body: |
            Release for commit ${{ github.sha }}
            - Version: ${{ github.ref }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            ${{ github.event.repository.name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release asset info
        id: asset_info
        run: |
          ASSET_URL="${{ steps.create_release.outputs.upload_url }}"
          ASSET_NAME="${{ github.event.repository.name }}.tar.gz"
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Push release info to Docker repo
        run: |
          TARGET_DIR=/tmp/deploy-target
          SERVER_HOST=$(echo "${{ github.server_url }}" | sed 's|^https\?://||')
          GIT_REPO="http://moujitx:${{ secrets.PUSH_GIT_INTERNAL }}@${SERVER_HOST}/moujitx/com.moujitx.homebox.docker.git"

          git clone --depth=1 --single-branch --branch main "$GIT_REPO" "$TARGET_DIR" 2>/dev/null || {
            mkdir -p "$TARGET_DIR"
            git -C "$TARGET_DIR" init
            git -C "$TARGET_DIR" checkout --orphan main
          }

          # Update or create releases.json
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="moujitx"
          TAG_NAME="${{ github.ref_name }}"
          ASSET_NAME="${{ github.event.repository.name }}.tar.gz"
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -f "$TARGET_DIR/releases.json" ]; then
            # Use jq or node to update JSON
            node -e "
              const fs = require('fs');
              let data = {};
              try { data = JSON.parse(fs.readFileSync('$TARGET_DIR/releases.json', 'utf8')); } catch(e) {}
              data.client = {
                repo: '${REPO_OWNER}/${REPO_NAME}',
                tag: '${TAG_NAME}',
                assetName: '${ASSET_NAME}',
                updatedAt: '${UPDATED_AT}'
              };
              fs.writeFileSync('$TARGET_DIR/releases.json', JSON.stringify(data, null, 2) + '\n');
            "
          else
            node -e "
              const fs = require('fs');
              const data = {
                client: {
                  repo: '${REPO_OWNER}/${REPO_NAME}',
                  tag: '${TAG_NAME}',
                  assetName: '${ASSET_NAME}',
                  updatedAt: '${UPDATED_AT}'
                }
              };
              fs.writeFileSync('$TARGET_DIR/releases.json', JSON.stringify(data, null, 2) + '\n');
            "
          fi

          git -C "$TARGET_DIR" add releases.json
          git -C "$TARGET_DIR" -c user.name=moujitx -c user.email=moujitx_chn@qq.com \
            commit -m "chore: update client release info to ${{ github.ref_name }}" --allow-empty
          git -C "$TARGET_DIR" push "$GIT_REPO" main
